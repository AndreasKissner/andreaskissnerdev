<footer class="footer">
  <div class="footer__container">
    <div class="footer__meta">
      <p class="footer__copyright">
        &copy; {{ currentYear }} Andreas Kissner — {{ 'FOOTER.RIGHTS' | translate }}
      </p>
      @if (performance.loadTimeMs() !== null) {
        <p class="footer__perf">{{ 'FOOTER.LOAD_TIME' | translate: { ms: performance.loadTimeMs() } }}</p>
      }
    </div>

    <nav class="footer__links" [attr.aria-label]="'FOOTER.IMPRINT' | translate">
      <a class="footer__link" href="#imprint">{{ 'FOOTER.IMPRINT' | translate }}</a>
      <a class="footer__link" href="#privacy">{{ 'FOOTER.PRIVACY' | translate }}</a>
      <a class="footer__link" href="https://www.andreas-kissner.cloud/#portfolio" target="_blank" rel="noopener">
        {{ 'NAV.PORTFOLIO' | translate }}
      </a>
    </nav>
  </div>
</footer>
