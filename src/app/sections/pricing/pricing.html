<section class="pricing" id="pricing" aria-labelledby="pricing-title">
  <div class="pricing__container">
    <h2 class="pricing__title" id="pricing-title">{{ 'PRICING.TITLE' | translate }}</h2>
    <p class="pricing__intro">{{ 'PRICING.INTRO' | translate }}</p>

    <div class="pricing__card">
      <p class="pricing__amount">{{ 'PRICING.AMOUNT' | translate }}</p>
      <p class="pricing__amount-label">{{ 'PRICING.AMOUNT_LABEL' | translate }}</p>
      <p class="pricing__note">{{ 'PRICING.NOTE' | translate }}</p>
      <a class="pricing__cta" href="#contact" appMagnetic>{{ 'PRICING.CTA' | translate }}</a>
    </div>
  </div>
  <app-section-divider />
</section>
