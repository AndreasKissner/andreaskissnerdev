<a
  class="back-to-top"
  [class.back-to-top--visible]="scrollState.isScrolled()"
  [attr.tabindex]="scrollState.isScrolled() ? 0 : -1"
  [attr.aria-hidden]="!scrollState.isScrolled()"
  [attr.aria-label]="'A11Y.BACK_TO_TOP' | translate"
  href="#top"
>
  <svg class="back-to-top-icon" viewBox="0 0 24 27" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="back-to-top-flame" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffe17a" />
        <stop offset="45%" stop-color="var(--color-accent)" />
        <stop offset="100%" stop-color="var(--color-accent-strong)" />
      </linearGradient>
    </defs>

    <path d="M12 18.4c-1.4 1.6-2.1 3.1-2.1 4.6 0 1.2.5 2.3 1.4 3l.7.55.7-.55c.9-.7 1.4-1.8 1.4-3 0-1.5-.7-3-2.1-4.6z" fill="url(#back-to-top-flame)" />

    <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.5c2.8 1.7 4.5 4.8 4.5 8.5 0 2-.5 3.8-1.4 5.3l-3.1 3.2-3.1-3.2C7.99 14.8 7.5 13 7.5 11c0-3.7 1.7-6.8 4.5-8.5z" />
      <circle cx="12" cy="10.5" r="1.6" />
      <path d="M8.6 15.5 6 17.2c-.5.35-.8.9-.8 1.5v1.8l2-.9c.5-.22.85-.68.95-1.22l.45-2.2z" />
      <path d="M15.4 15.5 18 17.2c.5.35.8.9.8 1.5v1.8l-2-.9c-.5-.22-.85-.68-.95-1.22l-.45-2.2z" />
    </g>
  </svg>
</a>
