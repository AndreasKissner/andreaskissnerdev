<div class="shm-demo" tabindex="0" role="group" [attr.aria-label]="'WORK.SHM_DEMO_LABEL' | translate">
  <ol class="shm-demo__list">
    @for (key of stepKeys; track key; let i = $index) {
      <li class="shm-demo__step" [style.--shm-demo-delay.ms]="i * 350">
        <span class="shm-demo__step-index">{{ i + 1 }}</span>
        <span class="shm-demo__step-label">{{ key | translate }}</span>
      </li>
    }
  </ol>
</div>
