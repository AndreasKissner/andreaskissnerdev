@if (isOpen) {
  <div class="info-modal__backdrop" (click)="close()"></div>
  <div class="info-modal" role="dialog" aria-labelledby="info-modal-title">
    <div class="info-modal__content">
      <button
        class="info-modal__close"
        aria-label="Close modal"
        (click)="close()"
      >
        <svg
          viewBox="0 0 24 24"
          width="24"
          height="24"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <h2 class="info-modal__title" id="info-modal-title">
        {{ titleKey | translate }}
      </h2>

      <p class="info-modal__text">
        {{ textKey | translate }}
      </p>
    </div>
  </div>
}
