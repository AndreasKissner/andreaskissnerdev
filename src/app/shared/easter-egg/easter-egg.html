@if (easterEgg.isLaunched()) {
  <div class="easter-egg" role="dialog" aria-modal="true" [attr.aria-label]="'EASTER.TITLE' | translate">
    <div class="easter-egg__stars" aria-hidden="true">
      @for (star of stars; track $index) {
        <span
          class="easter-egg__star"
          [style.left.%]="star.x"
          [style.top.%]="star.y"
          [style.width.px]="star.radius * 2"
          [style.height.px]="star.radius * 2"
          [style.animation-delay.s]="star.delay"
          [style.animation-duration.s]="star.duration"
        ></span>
      }
    </div>

    <svg
      class="easter-egg__rocket"
      viewBox="0 0 24 27"
      fill="none"
      aria-hidden="true"
    >
      <defs>
        <linearGradient id="easter-egg-rocket-flame" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffe17a" />
          <stop offset="45%" stop-color="var(--color-accent)" />
          <stop offset="100%" stop-color="var(--color-accent-strong)" />
        </linearGradient>
      </defs>

      <g class="easter-egg__rocket-flame">
        <path d="M12 18.4c-1.4 1.6-2.1 3.1-2.1 4.6 0 1.2.5 2.3 1.4 3l.7.55.7-.55c.9-.7 1.4-1.8 1.4-3 0-1.5-.7-3-2.1-4.6z" fill="url(#easter-egg-rocket-flame)" />
      </g>

      <g class="easter-egg__rocket-body" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.5c2.8 1.7 4.5 4.8 4.5 8.5 0 2-.5 3.8-1.4 5.3l-3.1 3.2-3.1-3.2C7.99 14.8 7.5 13 7.5 11c0-3.7 1.7-6.8 4.5-8.5z" />
        <circle cx="12" cy="10.5" r="1.6" />
        <path d="M8.6 15.5 6 17.2c-.5.35-.8.9-.8 1.5v1.8l2-.9c.5-.22.85-.68.95-1.22l.45-2.2z" />
        <path d="M15.4 15.5 18 17.2c.5.35.8.9.8 1.5v1.8l-2-.9c-.5-.22-.85-.68-.95-1.22l-.45-2.2z" />
      </g>
    </svg>

    <div class="easter-egg__content">
      <p class="easter-egg__code">{{ 'EASTER.TITLE' | translate }}</p>
      <p class="easter-egg__message">{{ 'EASTER.MESSAGE' | translate }}</p>
      <button type="button" class="easter-egg__back" (click)="easterEgg.land()">
        {{ 'EASTER.BACK' | translate }}
      </button>
    </div>
  </div>
}
